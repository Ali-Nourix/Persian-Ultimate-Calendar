          let existing;
          try { existing = execFileSync("git", ["rev-parse", "--verify", `refs/tags/${tag}^{commit}`], { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }).trim(); }
          catch { /* Missing tag is expected on first manual release. */ }
