        run: npm run check
      - name: Timezone regression tests
        run: |
          TZ=Asia/Tehran npm test
          TZ=America/Los_Angeles npm test
      - run: npm run build
      - name: Package plugin and source
        run: |
          set -euo pipefail
          mkdir -p dist/persian-ultimate-calendar
          cp main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md dist/persian-ultimate-calendar/
          printf 'Source and installation guide: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" > dist/persian-ultimate-calendar/SOURCE.txt
          (cd dist && zip -r persian-ultimate-calendar.zip persian-ultimate-calendar)
          git archive --format=zip --output=dist/persian-ultimate-calendar-source.zip HEAD
      - name: Create or verify version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
