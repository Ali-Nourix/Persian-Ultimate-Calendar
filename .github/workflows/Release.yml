        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > dist/release-state.json 2>/dev/null; then
            if node --input-type=module -e 'import fs from "node:fs"; process.exit(JSON.parse(fs.readFileSync("dist/release-state.json")).isDraft ? 1 : 0);'; then
              echo "Release $RELEASE_TAG is already published; leaving it and its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Persian Ultimate Calendar $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md \
            dist/persian-ultimate-calendar.zip dist/persian-ultimate-calendar-source.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false
