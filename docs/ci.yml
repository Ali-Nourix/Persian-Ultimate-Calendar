name: Check and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [UTC, Asia/Tehran, America/Los_Angeles]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: matrix.timezone == 'UTC'
        with:
          name: persian-ultimate-calendar
          path: |
            main.js
            manifest.json
            styles.css
            LICENSE
            THIRD_PARTY_NOTICES.md
