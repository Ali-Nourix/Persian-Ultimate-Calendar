<g font-family="Arial, sans-serif">
<rect x="56" y="64" width="44" height="44" rx="10" fill="#2783DE"/>
<path d="M67 77h22v20H67z M67 83h22 M72 74v6 M84 74v6" fill="none" stroke="white" stroke-width="2"/>
<text x="116" y="93" fill="#7D7A75" font-size="18" letter-spacing="1.5">OBSIDIAN · JALALI · LOCAL API</text>
<text x="56" y="183" fill="#2C2C2B" font-size="50" font-weight="700">Your days.</text>
<text x="56" y="243" fill="#2C2C2B" font-size="50" font-weight="700">Your calendar.</text>
<text x="56" y="307" fill="#5F5C57" font-size="22">Persian dates, periodic notes</text>
<text x="56" y="341" fill="#5F5C57" font-size="22">and one simple date-picker API.</text>
<rect x="56" y="384" width="400" height="64" rx="8" fill="#E5F2FC"/>
<text x="80" y="423" font-family="monospace" fill="#1C568D" font-size="21">await api.pickDate()</text>
<text x="56" y="503" fill="#7D7A75" font-size="16">ULTIMATE PERSIAN CALENDAR / 4.2.1</text>
</g>
