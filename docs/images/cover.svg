<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Ultimate Persian Calendar</title><desc id="desc">Illustrated Jalali calendar for Farvardin 1404, with local date-picker API for Obsidian. Not a product screenshot.</desc>
