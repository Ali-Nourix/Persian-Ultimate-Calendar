name: Draft plugin release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag matching manifest version, e.g. v4.2.2"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: plugin-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate tag and package versions
        run: node scripts/validate-release.mjs
      - run: npm ci
      - name: Typecheck, tests and formatting
        run: npm run check
      - name: Timezone regression tests
        run: |
          TZ=Asia/Tehran npm test
          TZ=America/Los_Angeles npm test
      - run: npm run build
      - name: Package plugin and source
        run: |
          mkdir -p dist/persian-ultimate-calendar
          cp main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md dist/persian-ultimate-calendar/
          printf 'Source and installation guide: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" > dist/persian-ultimate-calendar/SOURCE.txt
          (cd dist && zip -r persian-ultimate-calendar.zip persian-ultimate-calendar)
          git archive --format=zip --output=dist/persian-ultimate-calendar-source.zip HEAD
      - name: Create draft release or update its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > dist/release-state.json 2>/dev/null; then
            node --input-type=module -e 'import fs from "node:fs"; if (!JSON.parse(fs.readFileSync("dist/release-state.json")).isDraft) throw new Error("Refusing to overwrite a published release");'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Persian Ultimate Calendar $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md dist/persian-ultimate-calendar.zip dist/persian-ultimate-calendar-source.zip --clobber
